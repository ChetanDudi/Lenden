# -XX:HeapBaseMinAddress=0x100000000 places the Java heap at 4 GB so native
# memory in the first 4 GB is not blocked by compressed-oops heap placement.
# -Xmx reduced to 1200m to leave headroom for R8 native allocations.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -XX:HeapBaseMinAddress=0x100000000
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx384m